name: Deploy Preview Subdomain to Angryhosting (preview.ericgitonga.com)

on:
  push:
    branches:
      - preview
    paths:
      - 'public/**'
      - 'src/**'
      - 'content/**'
      - 'VERSION'
      - '.github/workflows/deploy-preview.yml'
      - '.github/scripts/ftps_deploy.py'
      - '.github/scripts/letsencrypt_geny_intermediates.pem'
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Upload all tracked files instead of commit diff'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-deploy-ericgitonga-preview
  cancel-in-progress: false

jobs:
  test-and-deploy-preview:
    name: Test and Upload to preview.ericgitonga.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, curl, json

      - name: Run Unit Tests
        run: |
          php tests/run_unit_tests.php

      - name: Check if FTPS secrets are configured
        id: check_creds
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=FTPS Secrets Missing::FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD secrets are not yet configured on ericgitonga/ericgitonga-com."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect pertinent changed & retired files
        if: steps.check_creds.outputs.configured == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_ALL: ${{ inputs.sync_all }}
        run: |
          set -euo pipefail
          : > /tmp/deleted_files.txt
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${SYNC_ALL:-false}" = "true" ]; then
            git ls-files public src content VERSION > /tmp/changed_files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff -M --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$AFTER_SHA" -- public src content VERSION > /tmp/changed_files.txt
            git diff -M --name-status "$BEFORE_SHA" "$AFTER_SHA" -- public src content | python3 .github/scripts/ftps_deploy.py --mode preview --extract-retired-from-stdin > /tmp/deleted_files.txt || true
          else
            git ls-files public src content VERSION > /tmp/changed_files.txt
          fi

      - name: Upload application files to preview.ericgitonga.com via FTPS
        if: steps.check_creds.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          TLS_ARG=()
          if [[ "${FTP_SERVER}" != "angryhosting.com" && "${FTP_SERVER}" != *.angryhosting.com ]]; then
            TLS_ARG=(--tls-servername "angryhosting.com")
          fi
          python3 .github/scripts/ftps_deploy.py --mode preview --app-root /ericgitonga.com/preview --files-list /tmp/changed_files.txt --deleted-files-list /tmp/deleted_files.txt --release-sha "${GITHUB_SHA}" "${TLS_ARG[@]}"

      - name: Verify preview health readiness
        if: steps.check_creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          EXPECTED_VER="$(tr -d '[:space:]' < VERSION)"
          python3 - "$EXPECTED_VER" << 'PYEOF'
          import json, sys, time, urllib.request

          expected_ver = sys.argv[1]
          url = "https://preview.ericgitonga.com/api/health"
          last_err = ""
          for attempt in range(1, 7):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "PreviewDeployReadiness/1.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      data = json.loads(body)
                      if resp.status == 200 and data.get("status") == "ok" and data.get("version") == expected_ver:
                          print(f"Preview readiness verified: version={data.get('version')}, env={data.get('env')}")
                          sys.exit(0)
                      last_err = f"HTTP {resp.status}: {body}"
              except Exception as exc:
                  last_err = str(exc)
              time.sleep(3)
          print(f"Preview readiness note: {last_err}")
          PYEOF
