name: Deploy Production Monolith to Angryhosting (ericgitonga.com)

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'content/**'
      - 'VERSION'
      - '.github/workflows/deploy-prod.yml'
      - '.github/scripts/ftps_deploy.py'
      - '.github/scripts/letsencrypt_geny_intermediates.pem'
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Upload all tracked files instead of commit diff'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-deploy-ericgitonga-prod
  cancel-in-progress: false

jobs:
  test-and-deploy-prod:
    name: Test and Upload to ericgitonga.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, curl, json

      - name: Run Unit Tests
        run: |
          php tests/run_unit_tests.php

      - name: Check if FTPS secrets are configured
        id: check_creds
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error title=FTPS Secrets Missing::FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD secrets are required."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure production .env exists on remote
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROD_ENV_CONTENT: ${{ secrets.PROD_ENV_CONTENT }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, io
          sys.path.insert(0, ".github/scripts")
          from ftps_deploy import connect_verified_ftps

          host = os.environ["FTP_SERVER"]
          user = os.environ["FTP_USERNAME"]
          passwd = os.environ["FTP_PASSWORD"]

          ftp = connect_verified_ftps(host, user, passwd, tls_servername="angryhosting.com")

          prod_root = "/ericgitonga.com/www"
          try:
              ftp.cwd(prod_root)
          except Exception:
              ftp.mkd(prod_root)
              ftp.cwd(prod_root)

          files = ftp.nlst()
          if ".env" not in files:
              env_content = os.environ.get("PROD_ENV_CONTENT", "").strip()
              if env_content:
                  print("Provisioning production .env from repository secret...")
                  ftp.storbinary("STOR .env", io.BytesIO((env_content + "\n").encode("utf-8")))
                  print("Uploaded production .env")
              else:
                  print("Notice: .env not found on remote root; please configure PROD_ENV_CONTENT secret if bootstrap is needed.")
          else:
              print("Verified production .env already exists on remote.")
          ftp.quit()
          PYEOF

      - name: Detect pertinent changed & retired files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_ALL: ${{ inputs.sync_all }}
        run: |
          set -euo pipefail
          : > /tmp/deleted_files.txt
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${SYNC_ALL:-false}" = "true" ]; then
            git ls-files public src content VERSION > /tmp/changed_files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff -M --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$AFTER_SHA" -- public src content VERSION > /tmp/changed_files.txt
            git diff -M --name-status "$BEFORE_SHA" "$AFTER_SHA" -- public src content | python3 .github/scripts/ftps_deploy.py --mode prod --extract-retired-from-stdin > /tmp/deleted_files.txt || true
          else
            git ls-files public src content VERSION > /tmp/changed_files.txt
          fi

      - name: Upload application files to ericgitonga.com via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          TLS_ARG=()
          if [[ "${FTP_SERVER}" != "angryhosting.com" && "${FTP_SERVER}" != *.angryhosting.com ]]; then
            TLS_ARG=(--tls-servername "angryhosting.com")
          fi
          python3 .github/scripts/ftps_deploy.py --mode prod --app-root /ericgitonga.com/www --files-list /tmp/changed_files.txt --deleted-files-list /tmp/deleted_files.txt --release-sha "${GITHUB_SHA}" "${TLS_ARG[@]}"

      - name: Verify production health readiness
        run: |
          set -euo pipefail
          EXPECTED_VER="$(tr -d '[:space:]' < VERSION)"
          python3 - "$EXPECTED_VER" << 'PYEOF'
          import json, sys, time, urllib.request

          expected_ver = sys.argv[1]
          url = "https://ericgitonga.com/api/health"
          last_err = ""
          for attempt in range(1, 10):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "ProdDeployReadiness/1.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      data = json.loads(body)
                      if resp.status == 200 and data.get("status") == "ok" and data.get("version") == expected_ver:
                          print(f"Production readiness verified: version={data.get('version')}, env={data.get('env')}")
                          sys.exit(0)
                      last_err = f"HTTP {resp.status}: {body}"
              except Exception as exc:
                  last_err = str(exc)
              time.sleep(3)
          print(f"Production readiness note: {last_err}")
          PYEOF
