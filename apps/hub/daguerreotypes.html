<title>Daguerreotypes — Eric Gitonga</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,500;0,600;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="description" content="Photographs — landscapes, portraits, and documentary moments.">

<style>
  :root{
    --ground:#f3efe3;
    --ground-raised:#ece4cf;
    --ink:#241f16;
    --ink-muted:#7a7160;
    --accent:#3f6b53;
    --accent-dim:#8ba38f;
    --line:#d9cfb8;
    --serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --label:'Archivo Narrow', 'Arial Narrow', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--label);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .topbar{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:.6rem 1.5rem;
    padding:1.3rem 1.8rem;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:10;
    background:var(--ground);
  }
  .topbar-home{
    justify-self:start;
    font-family:var(--mono);
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.22em;
    color:var(--ink);
    transition:color .15s ease;
  }
  a.topbar-home:hover, a.topbar-home:focus-visible{color:var(--accent);}
  .topbar-plates{
    justify-self:center;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:1.25rem;
  }
  .topbar-plates a, .topbar-plates span{
    font-family:var(--mono);
    font-size:.72rem;
    font-weight:500;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-muted);
    transition:color .15s ease;
  }
  .topbar-plates a:hover, .topbar-plates a:focus-visible{color:var(--accent);}
  .topbar-plates [aria-current="page"]{color:var(--ink);}
  .topbar-links{
    justify-self:end;
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:1.4rem;
  }
  .topbar-links a{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.18em;
    color:var(--ink-muted);
    transition:color .15s ease;
  }
  .topbar-links a:hover, .topbar-links a:focus-visible{color:var(--accent);}
  .topbar-links [aria-current="page"]{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.18em;
    color:var(--ink);
  }

  @media (max-width:760px){
    .topbar{
      grid-template-columns:1fr;
      justify-items:center;
      text-align:center;
    }
    .topbar-home, .topbar-plates, .topbar-links{justify-self:center;}
  }

  .page{
    max-width:680px;
    margin:0 auto;
    padding:clamp(2.5rem,6vw,4rem) clamp(1.25rem,4vw,1.5rem) 4rem;
  }

  .plate-no{
    display:block;
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.14em;
    color:var(--ink-muted);
    margin-bottom:.5rem;
  }

  h1{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(2.4rem,7vw,3.2rem);
    line-height:1.05;
    margin:0 0 .7rem;
    text-wrap:balance;
  }

  .intro{
    font-family:var(--serif);
    font-size:1.05rem;
    color:var(--ink-muted);
    max-width:36em;
    margin:0;
    line-height:1.5;
  }

  section.group{margin-top:clamp(2.25rem,5vw,3rem);}
  .group-label{
    display:flex;
    align-items:baseline;
    gap:.75rem;
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 .9rem;
  }
  .group-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:.9rem 1.8rem;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.08em;
    color:var(--ink-muted);
  }

  .album-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:1rem;
  }
  .album-card{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:.4rem;
    padding:0;
    border:none;
    background:none;
    font:inherit;
    color:inherit;
    cursor:pointer;
    text-align:left;
  }
  .album-thumb{
    display:block;
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
    background:#000;
    border:1px solid var(--line);
  }
  .album-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .3s ease;
  }
  .album-card:hover .album-thumb img, .album-card:focus-visible .album-thumb img{
    transform:scale(1.04);
  }
  .album-title{
    font-family:var(--serif);
    font-style:italic;
    font-size:1.05rem;
    color:var(--ink);
  }
  .album-count{
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.06em;
    color:var(--ink-muted);
  }
  .gallery-updated{
    margin-top:1.5rem;
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.04em;
    color:var(--ink-muted);
  }
  .gallery-empty{
    font-family:var(--serif);
    color:var(--ink-muted);
  }

  dialog#gallery-modal{
    border:none;
    padding:0;
    margin:0;
    inset:0;
    width:100vw;
    height:100vh;
    max-width:100vw;
    max-height:100vh;
    background:var(--ground);
    color:var(--ink);
  }
  dialog#gallery-modal::backdrop{
    background:rgba(20,17,10,.92);
  }
  dialog#gallery-modal .modal-close{
    position:absolute;
    top:.6rem;
    right:.8rem;
    background:none;
    border:none;
    font-size:1.6rem;
    line-height:1;
    cursor:pointer;
    color:var(--ink-muted);
    z-index:2;
    padding:0;
  }
  dialog#gallery-modal .modal-close:hover, dialog#gallery-modal .modal-close:focus-visible{
    color:var(--accent);
  }
  dialog#gallery-modal .modal-fullscreen{
    position:absolute;
    top:.6rem;
    right:2.6rem;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-muted);
    z-index:2;
    padding:.2rem;
    display:flex;
  }
  dialog#gallery-modal .modal-fullscreen svg{
    width:1.3rem;
    height:1.3rem;
  }
  dialog#gallery-modal .modal-fullscreen:hover, dialog#gallery-modal .modal-fullscreen:focus-visible{
    color:var(--accent);
  }
  .gallery-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(36,31,22,.55);
    color:#f3efe3;
    border:none;
    width:2.6rem;
    height:2.6rem;
    border-radius:50%;
    font-size:1.6rem;
    line-height:1;
    cursor:pointer;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gallery-nav:hover, .gallery-nav:focus-visible{
    background:rgba(36,31,22,.8);
  }
  .gallery-prev{left:.6rem;}
  .gallery-next{right:.6rem;}
  .gallery-figure{
    margin:0;
    position:relative;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .gallery-figure:fullscreen{
    background:#000;
  }
  .gallery-image{
    display:block;
    width:100%;
    flex:1 1 auto;
    min-height:0;
    object-fit:contain;
    background:#000;
  }
  .gallery-caption{
    flex:none;
    padding:.7rem 1rem 0;
    font-family:var(--mono);
    font-size:.74rem;
    letter-spacing:.04em;
    color:var(--ink-muted);
    text-align:center;
  }
  .gallery-thumbs{
    display:flex;
    flex:none;
    gap:.5rem;
    padding:.6rem .8rem 1rem;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .gallery-thumb{
    flex:none;
    width:3.6rem;
    height:3.6rem;
    padding:0;
    border:2px solid transparent;
    border-radius:.25rem;
    overflow:hidden;
    cursor:pointer;
    background:#000;
    opacity:.55;
    transition:opacity .15s ease, border-color .15s ease;
  }
  .gallery-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .gallery-thumb:hover, .gallery-thumb:focus-visible{opacity:.85;}
  .gallery-thumb.is-active{
    opacity:1;
    border-color:var(--accent-dim);
  }
</style>

<header class="topbar">
  <a class="topbar-home" href="/">ERIC GITONGA</a>
  <nav class="topbar-plates" aria-label="Plates">
      <a href="/dudus">Dudus</a>
      <a href="/daguerreotypes">Daguerreotypes</a>
      <a href="/daubs">Daubs</a>

  <nav class="topbar-links" aria-label="Site">

      <a href="https://shop.ericgitonga.com">Shop</a>
      <a href="/#contact-modal">Contact</a>
  </nav>
</header>

<div class="page">
  <span class="plate-no">PLATE II</span>
  <h1>Daguerreotypes</h1>
  <p class="intro">Photographs — landscapes, portraits, and documentary moments.</p>

  <section class="group" aria-labelledby="photos-label">
    <p class="group-label" id="photos-label">Photographs</p>
    <div id="gallery-root"><p class="gallery-empty">Loading albums…</p></div>
  </section>
</div>

<footer class="foot">
  <span>PLATE II · DAGUERREOTYPES</span>
  <span>ericgitonga.com/daguerreotypes</span>
</footer>
