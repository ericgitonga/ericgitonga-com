<title>Daubs — Eric Gitonga</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,500;0,600;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="description" content="Drawings, watercolours, and marks made for their own sake, no other agenda. Coming soon.">

<style>
  :root{
    --ground:#f3efe3;
    --ink:#241f16;
    --ink-muted:#7a7160;
    --accent:#3f6b53;
    --accent-dim:#8ba38f;
    --line:#d9cfb8;
    --serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --label:'Archivo Narrow', 'Arial Narrow', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--label);
    display:flex;
    flex-direction:column;
    min-height:100dvh;
  }
  a{color:inherit;text-decoration:none;}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .topbar{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:.6rem 1.5rem;
    padding:1.3rem 1.8rem;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:10;
    background:var(--ground);
  }
  .topbar-home{
    justify-self:start;
    font-family:var(--mono);
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.22em;
    color:var(--ink);
    transition:color .15s ease;
  }
  a.topbar-home:hover, a.topbar-home:focus-visible{color:var(--accent);}
  .topbar-plates{
    justify-self:center;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:1.25rem;
  }
  .topbar-plates a, .topbar-plates span{
    font-family:var(--mono);
    font-size:.72rem;
    font-weight:500;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-muted);
    transition:color .15s ease;
  }
  .topbar-plates a:hover, .topbar-plates a:focus-visible{color:var(--accent);}
  .topbar-plates [aria-current="page"]{color:var(--ink);}
  .topbar-links{
    justify-self:end;
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:1.4rem;
  }
  .topbar-links a{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.18em;
    color:var(--ink-muted);
    transition:color .15s ease;
  }
  .topbar-links a:hover, .topbar-links a:focus-visible{
    color:var(--accent);
  }

  @media (max-width:760px){
    .topbar{
      grid-template-columns:1fr;
      justify-items:center;
      text-align:center;
    }
    .topbar-home, .topbar-plates, .topbar-links{justify-self:center;}
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem;
  }
  .plate-no{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.16em;
    color:var(--ink-muted);
    margin-bottom:.9rem;
  }
  h1{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(2.4rem,8vw,3.6rem);
    margin:0 0 .8rem;
  }
  p{
    font-family:var(--serif);
    font-size:1.05rem;
    color:var(--ink-muted);
    max-width:34ch;
    margin:0 0 1.6rem;
    line-height:1.5;
  }
  .back{
    display:inline-block;
    font-family:var(--mono);
    font-size:.78rem;
    letter-spacing:.04em;
    color:var(--accent);
    border-bottom:1px solid var(--accent-dim);
    padding-bottom:.2rem;
  }
  .back:hover, .back:focus-visible{border-color:var(--accent);}

  .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:.9rem 1.8rem;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.08em;
    color:var(--ink-muted);
  }
</style>

<header class="topbar">
  <a class="topbar-home" href="/">ERIC GITONGA</a>
  <nav class="topbar-plates" aria-label="Plates">
      <a href="/daguerreotypes">Daguerreotypes</a>
      <span aria-current="page">Daubs</span>
      <a href="/diffs">Diffs</a>
      <a href="/dudus">Dudus</a>
  </nav>
  <nav class="topbar-links" aria-label="Site">
      <a href="/#bio-modal">Bio</a>
      <a href="/blog">Blog</a>
      <a href="https://shop.ericgitonga.com">Shop</a>
      <a href="/#contact-modal">Contact</a>
  </nav>
</header>

<div class="page">
  <span class="plate-no">PLATE II</span>
  <h1>Daubs</h1>
  <p class="intro">Drawings, watercolours, and marks made for their own sake, no other agenda.</p>
  <section class="group" aria-labelledby="photos-label">
    <p class="group-label" id="photos-label">Art</p>
    <div id="gallery-root"><p class="gallery-empty">Loading albums…</p></div>
  </section>
</div>

<footer class="foot">
  <span>PLATE II · DAUBS</span>
  <span>ericgitonga.com/daubs</span>
</footer>

<script src="/assets/gallery.js" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', function () {
    initGallery('daguerreotypes');
  });
</script>
